[package]
edition = "2024"
name = "blue_engine_core"
version = "0.10.0"
authors = ["Elham Aryanpur <elhamaryanpur5@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "USE blue_engine THIS IS FOR INTERNAL USE"
readme = "README.md"
license = "Apache-2.0"

[features]
android = ["dep:android_logger"]
android_game_activity = ["winit/android-game-activity"]
android_native_activity = ["winit/android-native-activity"]
debug = ["dep:env_logger"]
default = ["debug"]
glam_fast_math = ["glam/fast-math"]
headless = []
u32 = []
window = ["dep:winit"]

[lib]
name = "blue_engine_core"
path = "src/lib.rs"

[dependencies.android_logger]
version = "0.15.0"
optional = true

[dependencies.bytemuck]
version = "1.24.0"
features = ["derive"]

[dependencies.downcast]
version = "0.11.0"

[dependencies.env_logger]
version = "0.11.8"
optional = true

[dependencies.glam]
version = "0.30.9"
features = [
    "bytemuck",
    "serde",
]

[dependencies.image]
version = "0.25.9"

[dependencies.log]
version = "0.4.29"

[dependencies.pollster]
version = "0.4.0"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.wgpu]
version = "=29.0.4"

[dependencies.winit]
version = "0.30.12"
features = ["rwh_06"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
version = "=29.0.4"

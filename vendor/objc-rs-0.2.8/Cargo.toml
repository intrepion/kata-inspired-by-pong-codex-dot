# Vendored from the crates.io normalized manifest; see VENDOR.md.

[package]
name = "objc-rs"
version = "0.2.8"
authors = [
    "Steven Sheldon",
    "Raphael Amorim",
]
build = false
exclude = [
    ".gitignore",
    ".travis.yml",
    "doc.sh",
    "travis_install.sh",
    "travis_test.sh",
    "tests-ios/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Objective-C Runtime bindings and wrapper for Rust. Maintained fork of objc crate"
documentation = "http://github.com/raphamorim/objc-rs"
readme = "README.md"
keywords = [
    "objective-c",
    "osx",
    "ios",
    "cocoa",
    "uikit",
]
license = "MIT"
repository = "http://github.com/raphamorim/objc-rs"

[lib]
name = "objc_rs"
path = "src/lib.rs"

[[example]]
name = "example"
path = "examples/example.rs"

[dependencies.objc_exception]
version = "0.1"
optional = true

[features]
exception = ["objc_exception"]
verify_message = []

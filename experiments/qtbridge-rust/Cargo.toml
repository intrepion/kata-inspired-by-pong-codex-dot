[package]
name = "pong-qtbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
[workspace]
[features]
default = ["qt"]
qt = ["dep:qtbridge"]
[dependencies]
pong-core = { path = "../../crates/pong-core" }
qtbridge = { git = "https://github.com/qt/qtbridge-rust", rev = "cdd681c4efd0ccb9e670c407bf5b9a0e4962ecb3", optional = true }
[[bin]]
name = "pong-qtbridge"
path = "src/main.rs"
required-features = ["qt"]

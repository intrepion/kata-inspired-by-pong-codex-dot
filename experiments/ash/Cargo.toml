[package]
name = "pong-ash"
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace]
[dependencies]
pong-low-level-common = { path = "../low-level-common" }
ash = "0.38"
raw-window-handle = "0.6"
pong-scenario = { path = "../../crates/pong-scenario" }
pong-benchmark = { path = "../../crates/pong-benchmark" }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
winit = "=0.30.13"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ash-window = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "=1.1.0"

[patch.crates-io]
objc2-foundation = { path = "../../vendor/objc2-foundation-0.2.2" }

[package]
license = "MIT"
name = "pong-sdl3"
version = "0.1.0"
edition = "2021"
[workspace]
[features]
default = ["bundled"]
bundled = ["sdl3/build-from-source-static"]
[dependencies]
pong-low-level-common = { path = "../low-level-common" }
sdl3 = "0.22.1"
pong-scenario = { path = "../../crates/pong-scenario" }
pong-benchmark = { path = "../../crates/pong-benchmark" }

[patch.crates-io]
sdl3-sys = { path = "vendor/sdl3-sys" }

[package]
license = "MIT"
name = "pong-softbuffer"
version = "0.1.0"
edition = "2021"
[workspace]

[features]
# Local-only native diagnostic; never enable when packaging.
appkit-native-qa = []
[dependencies]
pong-low-level-common = { path = "../low-level-common" }
softbuffer = "0.4"
pong-scenario = { path = "../../crates/pong-scenario" }
pong-benchmark = { path = "../../crates/pong-benchmark" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
winit = "=0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"

[patch.crates-io]
softbuffer = { path = "../../vendor/softbuffer-0.4.8" }
objc2-foundation = { path = "../../vendor/objc2-foundation-0.2.2" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "=0.2.2", features = ["NSThread", "dispatch"] }
core-foundation = "=0.9.4"

[package]
name = "pong-leptos"
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace]
[dependencies]
pong-web-ui-common = { path = "../web-ui-common" }
leptos = { version = "0.8", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEvent", "PointerEvent", "FocusEvent", "Node"] }
wasm-bindgen = "0.2"
web-time = "1"
send_wrapper = "0.6"

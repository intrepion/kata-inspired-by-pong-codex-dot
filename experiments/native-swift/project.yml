name: PongNativeSwift
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  NativePong:
    path: .
targets:
  PongNativeSwift:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NativePong
        product: PongCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intrepion.pong.native.swift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
  PongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PongNativeSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intrepion.pong.native.swift.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

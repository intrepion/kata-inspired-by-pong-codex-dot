name: Arcade capture pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/arcade-capture-pilot.yml
      - scripts/capture-arcade.cjs
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test and stage exact game files
        run: |
          node --test tests/game.test.js
          mkdir capture-site
          cp index.html style.css game.js capture-site/
      - name: Capture real gameplay
        env:
          CAPTURE_OUTPUT: capture-output
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory capture-site > /tmp/rallylight-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 0.25; done
          node scripts/capture-arcade.cjs
      - name: Upload capture and provenance
        uses: actions/upload-artifact@v4
        with:
          name: rallylight-capture-${{ github.sha }}
          path: capture-output/
          if-no-files-found: error
          retention-days: 14

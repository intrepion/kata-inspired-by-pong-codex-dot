name: TauriInputProbe
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  ProbeHost:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intrepion.pong.tauri.probehost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  TauriInputTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ProbeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intrepion.pong.tauri.inputtests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

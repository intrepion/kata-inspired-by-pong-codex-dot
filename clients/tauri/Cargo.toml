[package]
name = "pong-tauri"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
name = "pong_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde_json = "1"
pong-core = { path = "../../crates/pong-core" }
pong-scenario = { path = "../../crates/pong-scenario" }
tauri = { version = "2.12.5", features = [] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
